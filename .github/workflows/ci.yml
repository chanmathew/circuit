name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install vp
        run: curl -fsSL https://vite.plus | bash
        env:
          VP_NODE_MANAGER: 'no'

      - name: Add vp to PATH
        run: echo "${HOME}/.vite-plus/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: vp install --frozen-lockfile
        env:
          CI: true

      - name: Lint, format, and typecheck
        run: vp check

      - name: Audit dependencies
        run: vp pm audit -- --audit-level=high
